name: Build TrailLog IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Archive (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project TrailLog.xcodeproj \
            -scheme TrailLog \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/TrailLog.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO
          test -d build/TrailLog.xcarchive/Products/Applications/TrailLog.app || { echo "ERROR: TrailLog.app was not produced by the archive step"; exit 1; }

      - name: Package IPA
        run: |
          set -euo pipefail
          rm -rf Payload TrailLog.ipa
          mkdir Payload
          cp -R build/TrailLog.xcarchive/Products/Applications/TrailLog.app Payload/
          ditto -c -k --keepParent Payload TrailLog.ipa
          ls -lh TrailLog.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TrailLog-ipa
          path: TrailLog.ipa
          if-no-files-found: error
